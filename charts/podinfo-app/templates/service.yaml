apiVersion: v1
kind: Service
metadata:
  name: {{ include "podinfo-app.fullname" . }}
  labels:
    {{- include "podinfo-app.labels" . | nindent 4 }}
  # No cloud.google.com/neg annotation: on a VPC-native cluster GKE creates and
  # OWNS that annotation for Services behind an Ingress/Gateway. Declaring it in
  # git guarantees a permanent ArgoCD OutOfSync.
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "podinfo-app.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
