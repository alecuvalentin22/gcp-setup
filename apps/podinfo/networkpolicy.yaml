# NetworkPolicy — only enforced because the cluster runs Dataplane V2
# (datapath_provider = ADVANCED_DATAPATH in modules/gke). On Dataplane V1
# without Calico these objects apply cleanly and are then IGNORED: no error, no
# isolation, and you believe you are protected. Verify enforcement, never assume.
#
# Default-deny + explicit allow. Note NetworkPolicy is ADDITIVE: rules union,
# there is no "deny" rule. Isolation comes from selecting a pod at all — once
# any policy selects a pod, everything not explicitly allowed is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  # Empty selector = every pod in this namespace.
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-lb-and-healthchecks
spec:
  podSelector:
    matchLabels:
      app: podinfo
  policyTypes:
    - Ingress
  ingress:
    - from:
        # ⚠️ THE TRAP: a default-deny breaks Google load balancer health checks,
        # backends go UNHEALTHY, and the LB starts returning 502 — while the
        # pods themselves are perfectly fine. These two ranges are Google's
        # health-check probers and must be allowed explicitly.
        #   35.191.0.0/16   health checks + LB proxies
        #   130.211.0.0/22  legacy health check range
        - ipBlock:
            cidr: 35.191.0.0/16
        - ipBlock:
            cidr: 130.211.0.0/22
      ports:
        - protocol: TCP
          port: 9898
    # Same-namespace traffic (so the two exposure paths and any sidecars work).
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 9898
---
# Egress policy kept separate so you can delete it alone to see the difference.
# DNS is the thing everyone forgets: deny egress without allowing UDP/TCP 53 to
# kube-dns and every outbound call fails with a name-resolution error that looks
# nothing like a firewall problem.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Everything else outbound (through Cloud NAT). Tighten this to specific
    # CIDRs, or use FQDN policy (Dataplane V2), for a real egress lockdown.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
