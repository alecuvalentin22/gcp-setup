# Demo workload. Plain manifests rather than a Helm umbrella chart so there is
# no chart version to pin or drift — use the umbrella pattern for real
# third-party software.
#
# podinfo is chosen because it exposes Prometheus metrics on /metrics, which
# lets Managed Service for Prometheus scrape it (see podmonitoring.yaml) and so
# demonstrates the managed replacement for a self-hosted kube-prometheus stack.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports:
            - name: http
              containerPort: 9898
          # Deliberately small: 2x e2-medium gives ~1.9 vCPU allocatable total,
          # and GKE system pods plus ArgoCD already claim a large share.
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9898
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  # NO cloud.google.com/neg annotation here on purpose.
  #
  # On a VPC-native cluster GKE creates the NEG automatically for any Service
  # backing an Ingress or Gateway, and it OWNS that annotation — it rewrites the
  # value to {"exposed_ports":{"80":{}}} and adds neg-status alongside. Declaring
  # '{"ingress": true}' in git therefore guarantees a permanent OutOfSync: git
  # asserts one value, the controller writes another, forever.
  #
  # Container-native LB still happens; verify with:
  #   gcloud compute network-endpoint-groups list
spec:
  type: ClusterIP
  selector:
    app: podinfo
  ports:
    - name: http
      port: 80
      targetPort: 9898
---
# Exposure lives in git, not in a `kubectl patch`. Deleting this file removes
# the load balancer; ArgoCD prune reclaims the forwarding rule and IP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: podinfo
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: podinfo
                port:
                  number: 80
